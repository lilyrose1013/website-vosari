<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Caption Your Cat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="content center">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
      <h1 style="margin: 0;">Caption Your Cat</h1>
      <button onclick="submitCaption()" style="padding: 0.5rem 1rem; font-size: 1rem;">Submit Caption</button>
    </div>
    <img id="catImage" src="" alt="Random Cat" style="max-width: 100%; border-radius: 12px; margin-top: 1rem;" />
    <br><br>
    <input type="text" id="captionInput" placeholder="Type your caption..." style="padding: 10px; width: 80%; font-size: 1rem;" />
  </main>

  <script>
    const imageEl = document.getElementById('catImage');
    const imageUrl = sessionStorage.getItem('catImageUrl');

    if (imageUrl) {
      imageEl.src = imageUrl;
    } else {
      fetch('https://api.thecatapi.com/v1/images/search?limit=1', {
        headers: {
          'x-api-key': 'ylX4blBYT9FaoVd6OhvR'
        }
      })
        .then(res => res.json())
        .then(data => {
          const url = data[0]?.url;
          if (url) {
            imageEl.src = url;
            sessionStorage.setItem('catImageUrl', url);
          }
        });
    }

    function submitCaption() {
      const caption = document.getElementById('captionInput').value;
      sessionStorage.setItem('catCaption', caption);
      window.location.href = 'Your_Cat.html';
    }
  </script>
</body>
</html>
