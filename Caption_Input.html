<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Captioned Cat</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      background-color: #ffe6f0;
      font-family: "Inconsolata", monospace;
    }

    main.content {
      max-width: 600px;
      margin: 5vh auto;
      padding: 2rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      background-color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      margin-bottom: 1.5rem;
    }

    img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 1rem;
    }

    p.caption {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: #e91e63;
    }

    textarea {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .button-container {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      background-color: #e91e63;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #d81b60;
    }
  </style>
</head>
<body>
  <main class="content">
    <h1>Your Captioned Cat</h1>
    <img id="catImage" src="" alt="Your Cat" />

    <p id="captionText" class="caption" style="display: none;"></p>
    <textarea id="captionInput" placeholder="Type your caption here..."></textarea>

    <div class="button-container">
      <button onclick="saveCaption()">Save Caption</button>
      <button onclick="tryAgain()">Try Another</button>
    </div>
  </main>

  <script>
    const imageUrl = sessionStorage.getItem('catImageUrl');
    const caption = sessionStorage.getItem('catCaption');

    const captionText = document.getElementById('captionText');
    const captionInput = document.getElementById('captionInput');

    if (imageUrl) {
      document.getElementById('catImage').src = imageUrl;
    }

    if (caption && caption.trim() !== '') {
      captionText.textContent = caption;
      captionText.style.display = 'block';
      captionInput.style.display = 'none';
    } else {
      captionText.style.display = 'none';
      captionInput.style.display = 'block';
    }

    function saveCaption() {
      const newCaption = captionInput.value.trim();
      if (newCaption) {
        sessionStorage.setItem('catCaption', newCaption);
        window.location.href = 'Your_Cat.html';
      }
    }

    function tryAgain() {
      sessionStorage.removeItem('catCaption');
      captionInput.value = '';
      captionInput.style.display = 'block';
      captionText.style.display = 'none';
    }
  </script>
</body>
</html>
