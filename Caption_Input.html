<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Captioned Cat</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      background-color: #ffe6f0;
      font-family: "Inconsolata", monospace;
    }

    main.content {
      max-width: 600px;
      margin: 5vh auto;
      padding: 2rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      background-color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      margin-bottom: 1.5rem;
    }

    img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 1rem;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 1rem;
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: vertical;
    }

    p.caption {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: #e91e63;
    }

    .button-container {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      background-color: #e91e63;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #d81b60;
    }
  </style>
</head>
<body>
  <main class="content">
    <h1>Your Captioned Cat</h1>
    <img id="catImage" src="" alt="Your Cat" />

    <textarea id="captionInput" placeholder="Type your caption here..."></textarea>
    <button onclick="setCaption()">Set Caption</button>

    <p id="captionText" class="caption"></p>

    <div class="button-container">
      <button onclick="goBack()">Try Another</button>
    </div>
  </main>

  <script>
    const imageUrl = sessionStorage.getItem('catImageUrl');
    const caption = sessionStorage.getItem('catCaption');

    if (imageUrl) {
      document.getElementById('catImage').src = imageUrl;
    }

    if (caption) {
      document.getElementById('captionText').textContent = caption;
      document.getElementById('captionInput').value = caption;
    }

    function setCaption() {
      const newCaption = document.getElementById('captionInput').value.trim();
      if (newCaption) {
        sessionStorage.setItem('catCaption', newCaption);
        document.getElementById('captionText').textContent = newCaption;
      }
    }

    function goBack() {
      sessionStorage.removeItem('catImageUrl');
      sessionStorage.removeItem('catCaption');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
