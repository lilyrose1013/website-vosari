<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caption Your Cat</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }

    main.content {
      max-width: 600px;
      margin: 5vh auto;
      padding: 2rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      background-color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      margin-bottom: 1.5rem;
    }

    img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 1rem;
    }

    input[type="text"] {
      padding: 10px;
      width: 80%;
      font-size: 1rem;
      margin-top: 1.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .button-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }

    button {
      padding: 0.5rem 1.5rem;
      font-size: 1rem;
      border: none;
      background-color: #e91e63;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #d81b60;
    }
  </style>
</head>
<body>
  <main class="content">
    <h1>Caption Your Cat</h1>

    <img id="catImage" src="" alt="Random Cat" />

    <input type="text" id="captionInput" placeholder="Type your caption..." />

    <div class="button-container">
      <button onclick="submitCaption()">Submit Caption</button>
    </div>
  </main>

  <script>
    const imageEl = document.getElementById('catImage');
    const imageUrl = sessionStorage.getItem('catImageUrl');

    if (imageUrl) {
      imageEl.src = imageUrl;
    } else {
      fetch('https://api.thecatapi.com/v1/images/search?limit=1', {
        headers: {
          'x-api-key': 'ylX4blBYT9FaoVd6OhvR'
        }
      })
        .then(res => res.json())
        .then(data => {
          const url = data[0]?.url;
          if (url) {
            imageEl.src = url;
            sessionStorage.setItem('catImageUrl', url);
          }
        });
    }

    function submitCaption() {
      const caption = document.getElementById('captionInput').value;
      sessionStorage.setItem('catCaption', caption);
      window.location.href = 'Your_Cat.html';
    }
  </script>
</body>
</html>
