<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cat</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .cat-wrapper {
      position: relative;
      display: inline-block;
      max-width: 90%;
      margin-top: 20px;
    }

    .cat-wrapper img {
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
    }

    .caption-overlay {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      text-align: center;
      color: hotpink;
      font-size: 2.5rem;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 1.5s ease-in-out forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="center">
    <h1>Your Cat</h1>
    <div id="catContainer"></div>
    <button onclick="goBack()">Back</button>
  </main>

  <script>
    const container = document.getElementById('catContainer');
    const catUrl = sessionStorage.getItem('catImageUrl');
    const catCaption = sessionStorage.getItem('catCaption') || 'Your caption here';

    if (catUrl) {
      const wrapper = document.createElement('div');
      wrapper.className = 'cat-wrapper';

      const img = document.createElement('img');
      img.src = catUrl;
      img.alt = 'Cat Image';
      img.onclick = () => window.open(catUrl, '_blank');

      const caption = document.createElement('div');
      caption.className = 'caption-overlay';
      caption.textContent = catCaption;

      wrapper.appendChild(img);
      wrapper.appendChild(caption);
      container.appendChild(wrapper);
    } else {
      container.innerHTML = '<p>No cat image found. Please go back and try again.</p>';
    }

    function goBack() {
      window.location.href = 'Caption_Input.html';
    }

    // Restore input on caption input page when navigated back
    window.addEventListener('DOMContentLoaded', () => {
      const captionInput = document.getElementById('captionInput');
      const storedCaption = sessionStorage.getItem('catCaption');
      if (captionInput && storedCaption) {
        captionInput.value = storedCaption;
      }

      const catPreview = document.getElementById('previewImage');
      const storedImage = sessionStorage.getItem('catImageUrl');
      if (catPreview && storedImage) {
        catPreview.src = storedImage;
      }
    });
  </script>
</body>
</html>
