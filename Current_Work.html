  <script>
    const API_KEY = 'ylX4blBYT9FaoVd6OhvR';

    function divinationExp() {
      fetch('https://api.thecatapi.com/v1/images/search?limit=1', {
        headers: {
          'x-api-key': API_KEY
        }
      })
        .then(res => res.json())
        .then(data => {
          const imageUrl = data[0]?.url;
          if (imageUrl) {
            sessionStorage.setItem('catImageUrl', imageUrl);
            window.location.href = 'Caption_Input.html';
          } else {
            alert('No image found.');
          }
        })
        .catch(err => {
          alert('Error: ' + err.message);
        });
    }
  </script>
