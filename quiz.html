<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wdth,wght@87.5,200..900&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #f5f5f5;
    }
    .question {
      margin-bottom: 1.5rem;
    }
    .question h3 {
      margin-bottom: 0.5rem;
    }
    .answers button {
      margin: 0.25rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    .answers button.selected {
      background-color: yellow;
      color: black;
    }
    #submit {
      margin-top: 2rem;
      padding: 0.5rem 2rem;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar__container">
      <a href="/" id="navbar__logo">Lily-Rose Vosari</a>
      <div class="navbar__toggle" id="mobile-menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
      <ul class="navbar__menu">
        <li class="navbar__item"><a href="./index.html" class="navbar__links">Home</a></li>
        <li class="navbar__item"><a href="./About_me.html" class="navbar__links">About Me</a></li>
        <li class="navbar__item"><a href="./Current_Work.html" class="navbar__links">Current Work</a></li>
        <li class="navbar__item"><a href="./Past_Works.html" class="navbar__links">Past Works</a></li>
      </ul>
    </div>
  </nav>
  <h1>Which Bloomburrow Character Are You?</h1>
  <form id="quiz">
    <div class="question">
      <h3>1. Your strength?</h3>
      <div class="answers">
        <button type="button" data-answer="Mabel">Brave</button>
        <button type="button" data-answer="Flowerfoot">Graceful</button>
        <button type="button" data-answer="Whiskervale">Clever</button>
        <button type="button" data-answer="Steelburr">Fierce</button>
      </div>
    </div>
    <div class="question">
      <h3>2. Favorite place?</h3>
      <div class="answers">
        <button type="button" data-answer="Mabel">Village</button>
        <button type="button" data-answer="Flowerfoot">Meadow</button>
        <button type="button" data-answer="Whiskervale">River</button>
        <button type="button" data-answer="Steelburr">Battlefield</button>
      </div>
    </div>
    <div class="question">
      <h3>3. Pick a weapon:</h3>
      <div class="answers">
        <button type="button" data-answer="Mabel">Sword</button>
        <button type="button" data-answer="Flowerfoot">Leafblade</button>
        <button type="button" data-answer="Whiskervale">Spear</button>
        <button type="button" data-answer="Steelburr">Gauntlets</button>
      </div>
    </div>
    <div class="question">
      <h3>4. Your pace:</h3>
      <div class="answers">
        <button type="button" data-answer="Mabel">Steady</button>
        <button type="button" data-answer="Flowerfoot">Smooth</button>
        <button type="button" data-answer="Whiskervale">Fast</button>
        <button type="button" data-answer="Steelburr">Aggressive</button>
      </div>
    </div>
    <div class="question">
      <h3>5. You're known for:</h3>
      <div class="answers">
        <button type="button" data-answer="Mabel">Loyalty</button>
        <button type="button" data-answer="Flowerfoot">Discipline</button>
        <button type="button" data-answer="Whiskervale">Strategy</button>
        <button type="button" data-answer="Steelburr">Strength</button>
      </div>
    </div>
    <div class="question">
      <h3>6. Your flaw:</h3>
      <div class="answers">
        <button type="button" data-answer="Mabel">Stubborn</button>
        <button type="button" data-answer="Flowerfoot">Cold</button>
        <button type="button" data-answer="Whiskervale">Overthinking</button>
        <button type="button" data-answer="Steelburr">Reckless</button>
      </div>
    </div>
    <div class="question">
      <h3>7. Choose one:</h3>
      <div class="answers">
        <button type="button" data-answer="Mabel">Honor</button>
        <button type="button" data-answer="Flowerfoot">Focus</button>
        <button type="button" data-answer="Whiskervale">Wit</button>
        <button type="button" data-answer="Steelburr">Power</button>
      </div>
    </div>
    <button type="submit" id="submit">See Result</button>
  </form>
  <script>
    const quizForm = document.getElementById('quiz');
    const selectedAnswers = [];

    quizForm.querySelectorAll('button[type="button"]').forEach(button => {
      button.addEventListener('click', () => {
        const group = button.closest('.answers');
        group.querySelectorAll('button').forEach(btn => btn.classList.remove('selected'));
        button.classList.add('selected');
      });
    });

    quizForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const selections = quizForm.querySelectorAll('.answers .selected');
      const count = {};

      selections.forEach(btn => {
        const val = btn.getAttribute('data-answer');
        count[val] = (count[val] || 0) + 1;
      });

      let topChar = null;
      let max = 0;
      for (const char in count) {
        if (count[char] > max) {
          max = count[char];
          topChar = char;
        }
      }

      window.location.href = `result.html?character=${topChar}`;
    });
  </script>
</body>
</html>
